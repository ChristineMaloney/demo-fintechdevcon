<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart — Northwind Goods</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🛍️</text></svg>"
    />
  </head>
  <body data-page="cart">
    <header class="site">
      <div class="inner">
        <a class="brand" href="/">NORTHWIND <span>goods</span></a>
        <a class="cart-link" href="/cart" data-cart-link>Cart (0)</a>
      </div>
    </header>

    <main>
      <h1 class="page">Your cart</h1>
      <p class="sub">Quantities update the totals the checkout will charge.</p>

      <div class="columns">
        <div class="panel" data-cart-lines>
          <div class="empty">Loading…</div>
        </div>

        <div class="panel" data-summary hidden>
          <h2>Order summary</h2>
          <div class="totals" data-totals></div>
          <a class="btn block" href="/checkout" style="margin-top: 1.25rem"
            >Continue to checkout</a
          >
          <div style="margin-top: 0.85rem; text-align: center">
            <button class="link" data-clear>Empty cart</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="site">
      Demo application — no real orders are fulfilled and no payment is taken.
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
