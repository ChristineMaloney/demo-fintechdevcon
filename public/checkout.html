<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout — Northwind Goods</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🛍️</text></svg>"
    />
  </head>
  <body data-page="checkout">
    <header class="site">
      <div class="inner">
        <a class="brand" href="/">NORTHWIND <span>goods</span></a>
        <a class="cart-link" href="/cart" data-cart-link>Cart (0)</a>
      </div>
    </header>

    <main>
      <h1 class="page">Checkout</h1>
      <p class="sub">Review your order, then pay.</p>

      <div class="columns">
        <!-- ── Payment ────────────────────────────────────────────── -->
        <div class="panel">
          <h2>Payment</h2>

          <!--
            INTEGRATION SEAM — the payment form belongs here.

            Nothing renders into this container today. A payment
            provider's embedded UI would mount into it, or it would hold
            a hand-rolled card form posting to our own endpoint.
          -->
          <div id="payment-container">
            <div class="empty">Checking payment configuration…</div>
          </div>
        </div>

        <!-- ── Order summary ──────────────────────────────────────── -->
        <div class="panel">
          <h2>Order summary</h2>
          <div data-cart-lines-compact></div>
          <div class="totals" data-totals></div>
          <div class="cents-note" data-cents-note></div>
        </div>
      </div>
    </main>

    <footer class="site">
      Demo application — no real orders are fulfilled and no payment is taken.
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
