<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout — Northwind Goods</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🛍️</text></svg>"
    />

    <!--
      The J.P. Morgan Drop-in UI bundle is loaded at runtime from the URL
      the server reports at /api/checkout-config, not hardcoded here — the
      bundle is per-environment and each one talks to its own backend.
    -->
  </head>
  <body data-page="checkout">
    <header class="site">
      <div class="inner">
        <a class="brand" href="/">NORTHWIND <span>goods</span></a>
        <a class="cart-link" href="/cart" data-cart-link>Cart (0)</a>
      </div>
    </header>

    <main>
      <h1 class="page">Checkout</h1>
      <p class="sub">Review your order, then pay.</p>

      <div class="columns">
        <!-- ── Payment ────────────────────────────────────────────── -->
        <div class="panel">
          <h2>Payment</h2>

          <!--
            Billing details. JPM's checkout intent needs a consumer email
            and billing address, and the address is what the issuer's AVS
            check scores against.
          -->
          <form id="billing-form" novalidate>
            <label>Full name<input name="recipientFullName" autocomplete="name" required /></label>
            <label>Email<input name="email" type="email" autocomplete="email" required /></label>
            <label>Address<input name="line1" autocomplete="address-line1" required /></label>
            <div class="field-row">
              <label>City<input name="city" autocomplete="address-level2" required /></label>
              <label>State<input name="state" autocomplete="address-level1" maxlength="2" required /></label>
              <label>ZIP<input name="postalCode" autocomplete="postal-code" required /></label>
            </div>
            <input type="hidden" name="country" value="US" />
            <button type="submit" class="block">Continue to payment</button>
          </form>

          <!-- The JPM Drop-in UI mounts here once we have a session token. -->
          <div id="payment-container"></div>
        </div>

        <!-- ── Order summary ──────────────────────────────────────── -->
        <div class="panel">
          <h2>Order summary</h2>
          <div data-cart-lines-compact></div>
          <div class="totals" data-totals></div>
          <div class="cents-note" data-cents-note></div>
        </div>
      </div>
    </main>

    <footer class="site">
      Demo application — no real orders are fulfilled and no payment is taken.
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
