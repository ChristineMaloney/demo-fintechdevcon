<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northwind Goods</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🛍️</text></svg>"
    />
  </head>
  <body data-page="catalog">
    <header class="site">
      <div class="inner">
        <a class="brand" href="/">NORTHWIND <span>goods</span></a>
        <a class="cart-link" href="/cart" data-cart-link>Cart (0)</a>
      </div>
    </header>

    <main>
      <h1 class="page">Shop</h1>
      <p class="sub">
        A sample storefront with no payment provider wired up yet.
      </p>

      <div class="grid" data-products>
        <div class="empty">Loading products…</div>
      </div>
    </main>

    <footer class="site">
      Demo application — no real orders are fulfilled and no payment is taken.
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
